schemaVersion: 1
id: conference-local-release
goal: Prove the provider-independent Conference Planner delivery and corrective path locally
providerRefs: [bitbucket-ci, confluence-fixture, jira-fixture]
maxDelegationDepth: 3
status: approved
nodes:
  - id: boss-plan
    objective: Own the bounded local conference release proof
    owner: { role: boss, id: conference-boss }
    dependencies: []
    authorityScopes: [plan, implement, delegate, verify]
    budget: { timeMinutes: 1000, tokenLimit: 1000000, costUsd: 200, taskLimit: 200 }
    completionProfile: delivery
    requiredEvidenceTypes: [commit, test, report, review, human-approval]
    evidenceRefs: [boss-commit, boss-test, boss-report, boss-review, boss-approval]
    status: completed
  - id: manager-product
    parentId: boss-plan
    objective: Coordinate provider-independent product and design intent
    owner: { role: manager, id: product-manager }
    dependencies: [boss-plan]
    authorityScopes: [plan, delegate, verify]
    budget: { timeMinutes: 360, tokenLimit: 300000, costUsd: 60, taskLimit: 60 }
    completionProfile: engineering
    requiredEvidenceTypes: [commit, test]
    evidenceRefs: [product-commit, product-test]
    status: completed
  - id: manager-delivery
    parentId: boss-plan
    objective: Coordinate application integration work
    owner: { role: manager, id: delivery-manager }
    dependencies: [boss-plan]
    authorityScopes: [implement, delegate, verify]
    budget: { timeMinutes: 480, tokenLimit: 450000, costUsd: 90, taskLimit: 90 }
    completionProfile: engineering
    requiredEvidenceTypes: [commit, test]
    evidenceRefs: [delivery-commit, delivery-test]
    status: completed
  - id: manager-quality
    parentId: boss-plan
    objective: Coordinate browser acceptance and corrective evidence
    owner: { role: manager, id: quality-manager }
    dependencies: [boss-plan]
    authorityScopes: [implement, delegate, verify]
    budget: { timeMinutes: 480, tokenLimit: 450000, costUsd: 90, taskLimit: 90 }
    completionProfile: quality
    requiredEvidenceTypes: [test, journey, report]
    evidenceRefs: [quality-test, quality-journey, quality-report]
    status: completed
  - id: design-contract
    parentId: manager-product
    objective: Confirm the original local design contract and approved component states
    owner: { role: worker, id: design-worker }
    dependencies: [manager-product]
    authorityScopes: [implement, verify]
    budget: { timeMinutes: 90, tokenLimit: 50000, costUsd: 10, taskLimit: 8 }
    completionProfile: engineering
    requiredEvidenceTypes: [commit, test]
    evidenceRefs: [design-commit, design-test]
    status: completed
  - id: ui-state
    parentId: manager-delivery
    objective: Verify one conflict-dialog user-interface state
    owner: { role: worker, id: ui-worker }
    dependencies: [manager-delivery, design-contract]
    authorityScopes: [implement, verify]
    budget: { timeMinutes: 90, tokenLimit: 50000, costUsd: 10, taskLimit: 8 }
    completionProfile: engineering
    requiredEvidenceTypes: [commit, test]
    evidenceRefs: [ui-commit, ui-test]
    status: ready
  - id: api-adjustment
    parentId: manager-delivery
    objective: Verify one bounded personal-agenda API adjustment
    owner: { role: worker, id: api-worker }
    dependencies: [manager-delivery]
    authorityScopes: [implement, verify]
    budget: { timeMinutes: 90, tokenLimit: 50000, costUsd: 10, taskLimit: 8 }
    completionProfile: engineering
    requiredEvidenceTypes: [commit, test]
    evidenceRefs: [api-commit, api-test]
    status: ready
  - id: storybook-journey
    parentId: manager-quality
    objective: Verify the Storybook and Playwright conflict journey
    owner: { role: worker, id: browser-worker }
    dependencies: [manager-quality, design-contract]
    authorityScopes: [implement, verify]
    budget: { timeMinutes: 120, tokenLimit: 70000, costUsd: 14, taskLimit: 12 }
    completionProfile: quality
    requiredEvidenceTypes: [test, journey, report]
    evidenceRefs: [browser-test, browser-journey, browser-report]
    status: ready
  - id: integration
    parentId: manager-delivery
    objective: Integrate the UI, API, and browser journey evidence
    owner: { role: worker, id: integration-worker }
    dependencies: [ui-state, api-adjustment, storybook-journey]
    authorityScopes: [implement, verify]
    budget: { timeMinutes: 120, tokenLimit: 80000, costUsd: 16, taskLimit: 12 }
    completionProfile: engineering
    requiredEvidenceTypes: [commit, test, journey]
    evidenceRefs: [integration-commit, integration-test, integration-journey]
    status: ready
  - id: acceptance-run
    parentId: manager-quality
    objective: Run acceptance with the initial focus-restoration omission visible
    owner: { role: worker, id: acceptance-worker }
    dependencies: [integration]
    authorityScopes: [verify]
    budget: { timeMinutes: 60, tokenLimit: 30000, costUsd: 6, taskLimit: 4 }
    completionProfile: quality
    requiredEvidenceTypes: [test, journey, report]
    evidenceRefs: [acceptance-test, acceptance-journey, acceptance-report]
    status: ready
  - id: focus-restoration-correction
    parentId: manager-quality
    objective: Correct conflict-dialog focus restoration after the controlled acceptance failure
    owner: { role: worker, id: corrective-worker }
    dependencies: [acceptance-run]
    authorityScopes: [implement, verify]
    budget: { timeMinutes: 90, tokenLimit: 50000, costUsd: 10, taskLimit: 2 }
    completionProfile: quality
    requiredEvidenceTypes: [commit, test, journey]
    evidenceRefs: [focus-commit, focus-test, focus-journey]
    status: corrective
  - id: evidence-bundle
    parentId: manager-quality
    objective: Assemble the checksum-bound local release evidence
    owner: { role: worker, id: evidence-worker }
    dependencies: [focus-restoration-correction]
    authorityScopes: [verify]
    budget: { timeMinutes: 60, tokenLimit: 30000, costUsd: 6, taskLimit: 4 }
    completionProfile: quality
    requiredEvidenceTypes: [test, journey, report]
    evidenceRefs: [bundle-test, bundle-journey, bundle-report]
    status: ready
  - id: human-final
    parentId: boss-plan
    objective: Approve the truthful local conference release packet
    owner: { role: boss, id: conference-boss }
    dependencies: [evidence-bundle]
    authorityScopes: [verify]
    budget: { timeMinutes: 30, tokenLimit: 1000, costUsd: 1, taskLimit: 1 }
    completionProfile: delivery
    requiredEvidenceTypes: [commit, test, report, review, human-approval]
    evidenceRefs: [final-commit, final-test, final-report, final-review, final-approval]
    status: ready
    approvalGate: final-delivery

